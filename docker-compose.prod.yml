services:
  swiftapp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_EMAIL_PUBLIC_KEY=${NEXT_PUBLIC_EMAIL_PUBLIC_KEY}
        - NEXT_PUBLIC_EMAIL_SERVICE_ID=${NEXT_PUBLIC_EMAIL_SERVICE_ID}
        - NEXT_PUBLIC_EMAIL_TEMPLATE_ID=${NEXT_PUBLIC_EMAIL_TEMPLATE_ID}
        - NEXT_PUBLIC_MODE=${NEXT_PUBLIC_MODE}
    container_name: swiftapp
    restart: unless-stopped
    oom_score_adj: -1000
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.swiftapp.rule=Host(`swiftapp.ch`) || Host(`www.swiftapp.ch`)"
      - "traefik.http.routers.swiftapp.entrypoints=websecure"
      - "traefik.http.routers.swiftapp.tls.certresolver=letsencrypt"
      - "traefik.http.services.swiftapp.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  traefik:
    external: true
